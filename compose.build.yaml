x-user-service:
  &default-user-service
  image: kcordes/hm-user-service:latest
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_UID: 1000
      VERSION: ${VERSION:-1.0.0}

services:
  user-service-latest:
    *default-user-service
  
  user-service-major:
    <<: *default-user-service
    image: "kcordes/hm-user-service:${MAJOR:-1}"
    
  user-service-minor:
    <<: *default-user-service
    image: "kcordes/hm-user-service:${MAJOR:-1}.${MINOR:-0}"
    
  user-service-patch:
    <<: *default-user-service
    image: "kcordes/hm-user-service:${MAJOR:-1}.${MINOR:-0}.${PATCH:-0}"