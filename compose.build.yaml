x-hm-user-service:
  &default-hm-user-service
  image: katiecodes/hm-user-service:latest
  build:
    context: .
    dockerfile: Dockerfile
    target: final
    args:
      APP_UID: 1000
      VERSION: ${VERSION:-1.0.0}

services:
  hm-user-service-latest:
    *default-hm-user-service
  
  hm-user-service-major:
    <<: *default-hm-user-service
    image: "katiecodes/hm-user-service:${MAJOR:-1}"
    
  hm-user-service-minor:
    <<: *default-hm-user-service
    image: "katiecodes/hm-user-service:${MAJOR:-1}.${MINOR:-0}"
    
  hm-user-service-patch:
    <<: *default-hm-user-service
    image: "katiecodes/hm-user-service:${MAJOR:-1}.${MINOR:-0}.${PATCH:-0}"